name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "24"
          cache: true
      - run: vp install
      # `vp run build:site`, not the built-in `vp build`: the demo imports `rigid-ui`
      # through its exports map, so the library has to be packed first. Going through
      # the task graph pulls in that dependency; the built-in command would not.
      - run: vp run build:site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/demo/dist
      - id: deployment
        uses: actions/deploy-pages@v5
